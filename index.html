<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 작업 요청서</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .bg-brand { background-color: #722F37; }
        .text-brand { color: #722F37; }
        .border-brand { border-color: #722F37; }
        .hover-bg-brand:hover { background-color: #5c252c; }
        .focus-ring-brand:focus { --tw-ring-color: #722F37; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">

    <!-- 상단 헤더 (흰색 배경 + 하단 테두리 + 로고 중앙 정렬) -->
    <header class="bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-center items-center">
            <img src="/logo.png" alt="회사 로고" class="h-12 sm:h-14 w-auto object-contain">
        </div>
    </header>

    
    <main class="max-w-4xl mx-auto px-4 py-8">
        <!-- 메인 탭 (요청서 작성 / 조회) -->
        <div class="flex border-b border-slate-200 mb-8 bg-white rounded-t-xl p-2 shadow-sm">
            <button id="tab-create-btn" onclick="switchMainTab('create')" class="flex-1 py-3 font-semibold text-center text-brand border-b-2 border-brand transition">
                <i class="fa-solid fa-paper-plane mr-2"></i>새 디자인 요청하기
            </button>
            <button id="tab-lookup-btn" onclick="switchMainTab('lookup')" class="flex-1 py-3 font-semibold text-center text-slate-500 hover:text-slate-700 transition">
                <i class="fa-solid fa-list-check mr-2"></i>내 요청 조회 / 수정
            </button>
        </div>

        <!-- Section: 작성 폼 -->
        <section id="section-create" class="bg-white rounded-2xl shadow-md p-6 sm:p-10 space-y-8">
            
            <!-- 공통 영역 1: 프로젝트 명 -->
            <div>
                <label class="block text-sm font-bold text-slate-800 mb-2">프로젝트 명 *</label>
                <input type="text" id="c-project-name" required placeholder="예: 2026 여름 신메뉴 프로모션 디자인 요청" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand transition">
            </div>

            <!-- 공통 영역 2: 요청서 종류 선택 버튼 -->
            <div>
                <label class="block text-sm font-bold text-slate-800 mb-3">요청서 구분을 선택해 주세요 *</label>
                <div class="grid grid-cols-2 gap-4">
                    <button type="button" id="btn-type-store" onclick="selectFormType('가맹점')" class="py-3 px-4 rounded-xl border-2 border-brand bg-rose-50 text-brand font-bold transition flex justify-center items-center gap-2">
                        <i class="fa-solid fa-store"></i> 가맹점 디자인 요청서
                    </button>
                    <button type="button" id="btn-type-marketing" onclick="selectFormType('마케팅')" class="py-3 px-4 rounded-xl border-2 border-slate-200 text-slate-500 font-bold transition flex justify-center items-center gap-2">
                        <i class="fa-solid fa-bullhorn"></i> 마케팅 디자인 요청서
                    </button>
                </div>
            </div>

            <!-- 공통 영역 3: 브랜드 선택 -->
            <div>
                <label class="block text-sm font-bold text-slate-800 mb-2">브랜드 선택 *</label>
                <select id="c-brand" required class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand transition">
                    <option value="">브랜드를 선택해 주세요</option>
                    <option value="광안천지식당">광안천지식당</option>
                    <option value="천지두루치기">천지두루치기</option>
                    <option value="오늘은낙곱새">오늘은낙곱새</option>
                    <option value="천지냉면">천지냉면</option>
                    <option value="오늘은갈비찜">오늘은갈비찜</option>
                </select>
            </div>

            <hr class="border-slate-100 my-6">

            <!-- 폼 입력 영역 -->
            <form id="create-form" onsubmit="handleCreate(event)" class="space-y-6">
                
                <!-- 동적 양식: 가맹점 세부 항목 -->
                <div id="form-store-fields" class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">지점명 (가맹점명) *</label>
                            <input type="text" id="c-store-name" placeholder="예: 강남점" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">요청자 성함 *</label>
                            <input type="text" id="c-store-sv" placeholder="예: 홍길동" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">연락처 *</label>
                            <input type="text" id="c-store-contact" placeholder="예: 010-1234-5678" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">희망 마감일 *</label>
                            <input type="date" id="c-store-deadline" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">작업 분류 선택 *</label>
                            <select id="c-store-worktype" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                                <option value="">선택하세요</option>
                                <option value="인쇄물">인쇄물</option>
                                <option value="배달앱">배달앱</option>
                                <option value="디지털">디지털</option>
                                <option value="간판 및 인테리어">간판 및 인테리어</option>
                                <option value="패키지">패키지</option>
                                <option value="기타">기타</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">디자인 유형 *</label>
                            <input type="text" id="c-store-category" placeholder="예: 매장 POP, 메뉴판 수정, 배너 등" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">수량</label>
                            <input type="text" id="c-store-quantity" placeholder="예: 100장 / 1개" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">소재</label>
                            <input type="text" id="c-store-material" placeholder="예: 페트지, 종이, 아크릴 등" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">사이즈</label>
                            <input type="text" id="c-store-size" placeholder="예: A4, 600x1800mm" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">사용용도</label>
                            <input type="text" id="c-store-purpose" placeholder="예: 메뉴 홍보용" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">사용장소</label>
                            <input type="text" id="c-store-place" placeholder="예: 카운터 앞, 매장 입구" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                        </div>
                    </div>
                </div>

                <!-- 동적 양식: 마케팅 세부 항목 (초기 숨김) -->
                <div id="form-marketing-fields" class="space-y-6 hidden">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">요청자 성함 *</label>
                            <input type="text" id="c-mkt-sv" placeholder="예: 김마케팅" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">연락처 *</label>
                            <input type="text" id="c-mkt-contact" placeholder="예: 010-1234-5678" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">희망 마감일 *</label>
                            <input type="date" id="c-mkt-deadline" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">디자인 유형 *</label>
                            <input type="text" id="c-mkt-category" placeholder="예: 카드뉴스, 메인 배너, 이벤트 이미지" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">사용용도</label>
                            <input type="text" id="c-mkt-purpose" placeholder="예: 신규 프로모션 온라인 홍보" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">업로드 사이트 *</label>
                            <select id="c-mkt-uploadsite" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                                <option value="">선택하세요</option>
                                <option value="인스타그램">인스타그램</option>
                                <option value="블로그">블로그</option>
                                <option value="네이버 카페">네이버 카페</option>
                                <option value="당근마켓">당근마켓</option>
                                <option value="홈페이지">홈페이지</option>
                                <option value="기타">기타</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 공통 하단 항목: 우선순위, 특이사항, 사진 첨부 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">우선순위 *</label>
                    <select id="c-priority" required class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                        <option value="보통">보통</option>
                        <option value="긴급">긴급</option>
                        <option value="여유">여유</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">특이사항 및 상세 요청 내용 *</label>
                    <textarea id="c-details" required rows="4" placeholder="문구, 구성, 참고 디자인 등 요구사항을 상세히 적어주세요." class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">사진/참고파일 첨부</label>
                    <input type="file" id="c-file" class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-rose-50 file:text-brand hover:file:bg-rose-100">
                </div>

                <button type="submit" id="submit-btn" class="w-full py-4 bg-brand hover-bg-brand text-white font-bold rounded-xl shadow-lg transition duration-200">
                    디자인 요청 제출하기
                </button>
            </form>
        </section>

        <!-- Section: 조회 폼 -->
        <section id="section-lookup" class="hidden space-y-6">
            <div class="bg-white rounded-2xl shadow-md p-6 sm:p-8">
                <h2 class="text-lg font-bold text-slate-900 mb-4">내 요청 내역 찾기</h2>
                <div class="flex flex-col sm:flex-row gap-4">
                    <input type="text" id="l-sv" placeholder="작성자 성함" class="flex-1 px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                    <input type="text" id="l-contact" placeholder="연락처 (예: 010-1234-5678)" class="flex-1 px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                    <button onclick="fetchRequests()" class="px-8 py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-lg transition">조회</button>
                </div>
            </div>
            <div id="results-container" class="space-y-4"></div>
        </section>
    </main>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzpbVbVQ80tkAEqIF7_gf3uqRopWTlb6bLHD-FfZ9YaFuNwim_-fV1szkokelLy6lM9/exec";
        let currentFormType = "가맹점";

        function selectFormType(type) {
            currentFormType = type;
            const btnStore = document.getElementById('btn-type-store');
            const btnMkt = document.getElementById('btn-type-marketing');
            const storeFields = document.getElementById('form-store-fields');
            const mktFields = document.getElementById('form-marketing-fields');

            if(type === '가맹점') {
                btnStore.className = "py-3 px-4 rounded-xl border-2 border-brand bg-rose-50 text-brand font-bold transition flex justify-center items-center gap-2";
                btnMkt.className = "py-3 px-4 rounded-xl border-2 border-slate-200 text-slate-500 font-bold transition flex justify-center items-center gap-2";
                storeFields.classList.remove('hidden');
                mktFields.classList.add('hidden');
            } else {
                btnMkt.className = "py-3 px-4 rounded-xl border-2 border-brand bg-rose-50 text-brand font-bold transition flex justify-center items-center gap-2";
                btnStore.className = "py-3 px-4 rounded-xl border-2 border-slate-200 text-slate-500 font-bold transition flex justify-center items-center gap-2";
                mktFields.classList.remove('hidden');
                storeFields.classList.add('hidden');
            }
        }

        function switchMainTab(tab) {
            const createBtn = document.getElementById('tab-create-btn');
            const lookupBtn = document.getElementById('tab-lookup-btn');
            const createSec = document.getElementById('section-create');
            const lookupSec = document.getElementById('section-lookup');

            if(tab === 'create') {
                createBtn.className = "flex-1 py-3 font-semibold text-center text-brand border-b-2 border-brand transition";
                lookupBtn.className = "flex-1 py-3 font-semibold text-center text-slate-500 hover:text-slate-700 transition";
                createSec.classList.remove('hidden');
                lookupSec.classList.add('hidden');
            } else {
                lookupBtn.className = "flex-1 py-3 font-semibold text-center text-brand border-b-2 border-brand transition";
                createBtn.className = "flex-1 py-3 font-semibold text-center text-slate-500 hover:text-slate-700 transition";
                lookupSec.classList.remove('hidden');
                createSec.classList.add('hidden');
            }
        }

        async function handleCreate(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "제출 중 (파일 업로드 포함)...";

            const payload = {
                action: "CREATE",
                requestType: currentFormType === "가맹점" ? "가맹점 디자인 요청서" : "마케팅 디자인 요청서",
                projectName: document.getElementById('c-project-name').value,
                brand: document.getElementById('c-brand').value,
                priority: document.getElementById('c-priority').value,
                details: document.getElementById('c-details').value
            };

            if(currentFormType === "가맹점") {
                payload.store = document.getElementById('c-store-name').value;
                payload.sv_name = document.getElementById('c-store-sv').value;
                payload.contact = document.getElementById('c-store-contact').value;
                payload.deadline = document.getElementById('c-store-deadline').value;
                payload.workType = document.getElementById('c-store-worktype').value;
                payload.category = document.getElementById('c-store-category').value;
                payload.quantity = document.getElementById('c-store-quantity').value;
                payload.material = document.getElementById('c-store-material').value;
                payload.size = document.getElementById('c-store-size').value;
                payload.purpose = document.getElementById('c-store-purpose').value;
                payload.place = document.getElementById('c-store-place').value;
            } else {
                payload.sv_name = document.getElementById('c-mkt-sv').value;
                payload.contact = document.getElementById('c-mkt-contact').value;
                payload.deadline = document.getElementById('c-mkt-deadline').value;
                payload.category = document.getElementById('c-mkt-category').value;
                payload.purpose = document.getElementById('c-mkt-purpose').value;
                payload.uploadSite = document.getElementById('c-mkt-uploadsite').value;
            }

            const fileInput = document.getElementById('c-file');
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.readAsDataURL(file);
                await new Promise((resolve) => {
                    reader.onload = function () {
                        payload.fileData = reader.result;
                        payload.fileName = file.name;
                        payload.fileType = file.type;
                        resolve();
                    };
                });
            }

            try {
                await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
                alert("디자인 요청이 성공적으로 접수되었습니다!");
                document.getElementById('create-form').reset();
            } catch(err) {
                alert("제출 중 오류가 발생했습니다.");
            } finally {
                btn.disabled = false;
                btn.innerText = "디자인 요청 제출하기";
            }
        }

        async function fetchRequests() {
            const sv = document.getElementById('l-sv').value;
            const contact = document.getElementById('l-contact').value;
            const container = document.getElementById('results-container');

            if(!sv || !contact) {
                alert("성함과 연락처를 모두 입력해주세요.");
                return;
            }

            container.innerHTML = `<p class="text-center text-slate-500 py-8">요청 내역을 불러오는 중...</p>`;

            try {
                const res = await fetch(`${API_URL}?sv_name=${encodeURIComponent(sv)}&contact=${encodeURIComponent(contact)}`);
                const data = await res.json();

                if(data.length === 0) {
                    container.innerHTML = `<p class="text-center text-slate-500 py-8">일치하는 요청 내역이 없습니다.</p>`;
                    return;
                }

                container.innerHTML = data.map(req => `
                    <div class="bg-white rounded-xl shadow-md p-6 border-l-4 border-brand">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <span class="text-xs font-bold text-slate-400">[${req.requestType}] ${req.id}</span>
                                <h3 class="text-lg font-bold text-slate-800">${req.projectName} (${req.brand})</h3>
                            </div>
                            <span class="px-3 py-1 text-xs font-bold rounded-full bg-rose-100 text-brand">${req.status}</span>
                        </div>
                        <div class="text-sm text-slate-600 space-y-1 mb-4">
                            <p><strong>우선순위:</strong> ${req.priority}</p>
                            <p><strong>희망 마감일:</strong> ${req.deadline}</p>
                            <p><strong>상세내용:</strong> ${req.details}</p>
                            ${req.fileUrl ? `<p><strong>첨부파일:</strong> <a href="${req.fileUrl}" target="_blank" class="text-blue-600 underline">파일 열기</a></p>` : ''}
                        </div>
                    </div>
                `).join('');

            } catch(e) {
                container.innerHTML = `<p class="text-center text-red-500 py-8">조회 실패. 잠시 후 다시 시도해주세요.</p>`;
            }
        }
