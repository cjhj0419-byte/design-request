<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디자인 작업 요청서</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .bg-brand { background-color: #722F37; }
        .text-brand { color: #722F37; }
        .border-brand { border-color: #722F37; }
        .hover-bg-brand:hover { background-color: #5c252c; }
        .focus-ring-brand:focus { --tw-ring-color: #722F37; }
        .required-star { color: #ef4444; font-weight: bold; margin-left: 2px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">

    <!-- 상단 헤더 -->
    <header class="bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-4xl mx-auto px-6 py-4 flex justify-center items-center">
            <h1 class="text-2xl font-extrabold text-brand tracking-wide">디자인 작업 요청 시스템</h1>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <!-- 메인 탭 -->
        <div class="flex border-b border-slate-200 mb-8 bg-white rounded-t-xl p-2 shadow-sm">
            <button id="tab-create-btn" onclick="switchMainTab('create')" class="flex-1 py-3 font-semibold text-center text-brand border-b-2 border-brand transition">
                <i class="fa-solid fa-paper-plane mr-2"></i>새 디자인 요청하기
            </button>
            <button id="tab-lookup-btn" onclick="switchMainTab('lookup')" class="flex-1 py-3 font-semibold text-center text-slate-500 hover:text-slate-700 transition">
                <i class="fa-solid fa-list-check mr-2"></i>내 요청 조회 / 수정
            </button>
        </div>

        <!-- Section 1: 작성 폼 -->
        <section id="section-create" class="bg-white rounded-2xl shadow-md p-6 sm:p-10 space-y-8">
            <div>
                <label class="block text-sm font-bold text-slate-800 mb-2">프로젝트 명 <span class="required-star">*</span></label>
                <input type="text" id="c-project-name" required placeholder="예: 2026 신메뉴 프로모션 디자인 요청" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand transition">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-800 mb-3">요청서 구분을 선택해 주세요 <span class="required-star">*</span></label>
                <div class="grid grid-cols-2 gap-4">
                    <button type="button" id="btn-type-store" onclick="selectFormType('가맹점')" class="py-3 px-4 rounded-xl border-2 border-brand bg-rose-50 text-brand font-bold transition flex justify-center items-center gap-2">
                        <i class="fa-solid fa-store"></i> 가맹점 디자인 요청서
                    </button>
                    <button type="button" id="btn-type-marketing" onclick="selectFormType('마케팅')" class="py-3 px-4 rounded-xl border-2 border-slate-200 text-slate-500 font-bold transition flex justify-center items-center gap-2">
                        <i class="fa-solid fa-bullhorn"></i> 마케팅 디자인 요청서
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-800 mb-2">브랜드 선택 <span class="required-star">*</span></label>
                <select id="c-brand" required class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand transition">
                    <option value="">브랜드를 선택해 주세요</option>
                    <option value="광안천지식당">광안천지식당</option>
                    <option value="천지두루치기">천지두루치기</option>
                    <option value="오늘은낙곱새">오늘은낙곱새</option>
                    <option value="천지냉면">천지냉면</option>
                    <option value="오늘은갈비찜">오늘은갈비찜</option>
                </select>
            </div>

            <hr class="border-slate-100 my-6">

            <form id="create-form" onsubmit="handleCreate(event)" class="space-y-6">
                <!-- 가맹점 전용 세부 항목 -->
                <div id="form-store-fields" class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">지점명 (가맹점명) <span class="required-star">*</span></label>
                            <input type="text" id="c-store-name" placeholder="예: 강남점" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">요청자 성함 <span class="required-star">*</span></label>
                            <select id="c-store-sv" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                                <option value="">성함을 선택해 주세요</option>
                                <option value="김현준">김현준</option>
                                <option value="최장호">최장호</option>
                                <option value="이소영">이소영</option>
                                <option value="양지선">양지선</option>
                                <option value="김의현">김의현</option>
                                <option value="황인찬">황인찬</option>
                                <option value="김혜주">김혜주</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">희망 마감일 <span class="required-star">*</span></label>
                            <input type="date" id="c-store-deadline" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">디자인 유형 <span class="required-star">*</span></label>
                            <input type="text" id="c-store-category" placeholder="예: 매장 POP, 메뉴판 수정, 배너 등" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-3">작업 분류 선택 <span class="required-star">*</span></label>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3" id="store-worktype-group">
                            <button type="button" onclick="selectWorkType('인쇄물')" class="btn-worktype py-3 px-3 rounded-xl border-2 border-slate-200 text-slate-600 font-bold transition flex items-center justify-center gap-2" data-value="인쇄물"><i class="fa-solid fa-print"></i> 인쇄물</button>
                            <button type="button" onclick="selectWorkType('배달앱')" class="btn-worktype py-3 px-3 rounded-xl border-2 border-slate-200 text-slate-600 font-bold transition flex items-center justify-center gap-2" data-value="배달앱"><i class="fa-solid fa-motorcycle"></i> 배달앱</button>
                            <button type="button" onclick="selectWorkType('디지털')" class="btn-worktype py-3 px-3 rounded-xl border-2 border-slate-200 text-slate-600 font-bold transition flex items-center justify-center gap-2" data-value="디지털"><i class="fa-solid fa-laptop"></i> 디지털</button>
                            <button type="button" onclick="selectWorkType('간판 및 인테리어')" class="btn-worktype py-3 px-3 rounded-xl border-2 border-slate-200 text-slate-600 font-bold transition flex items-center justify-center gap-2 text-xs sm:text-sm" data-value="간판 및 인테리어"><i class="fa-solid fa-store"></i> 간판/인테리어</button>
                            <button type="button" onclick="selectWorkType('패키지')" class="btn-worktype py-3 px-3 rounded-xl border-2 border-slate-200 text-slate-600 font-bold transition flex items-center justify-center gap-2" data-value="패키지"><i class="fa-solid fa-box"></i> 패키지</button>
                            <button type="button" onclick="selectWorkType('기타')" class="btn-worktype py-3 px-3 rounded-xl border-2 border-slate-200 text-slate-600 font-bold transition flex items-center justify-center gap-2" data-value="기타"><i class="fa-solid fa-ellipsis"></i> 기타</button>
                        </div>
                    </div>
                </div>

                <!-- 마케팅 전용 세부 항목 -->
                <div id="form-marketing-fields" class="space-y-6 hidden">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">요청자 성함 <span class="required-star">*</span></label>
                            <select id="c-mkt-sv" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                                <option value="">성함을 선택해 주세요</option>
                                <option value="김현준">김현준</option>
                                <option value="최장호">최장호</option>
                                <option value="이소영">이소영</option>
                                <option value="양지선">양지선</option>
                                <option value="김의현">김의현</option>
                                <option value="황인찬">황인찬</option>
                                <option value="김혜주">김혜주</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">희망 마감일 <span class="required-star">*</span></label>
                            <input type="date" id="c-mkt-deadline" class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus-ring-brand">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div><label class="block text-sm font-semibold text-slate-700 mb-2">디자인 유형 <span class="required-star">*</span></label><input type="text" id="c-mkt-category" placeholder="예: 카드뉴스, 메인 배너" class="w-full px-4 py-3 rounded-lg border border-slate-200"></div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-3">업로드 사이트 <span class="required-star">*</span></label>
                            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3" id="mkt-uploadsite-group">
                                <button type="button" onclick="selectUploadSite('인스타그램')" class="btn-uploadsite py-3 px-3 rounded-xl border-2 border-slate-200 text-slate-600 font-bold transition flex items-center justify-center gap-2 text-xs sm:text-sm" data-value="인스타그램"><i class="fa-brands fa-instagram"></i> 인스타그램</button>
                                <button type="button" onclick="selectUploadSite('블로그')" class="btn-uploadsite py-3 px-3 rounded-xl border-2 border-slate-200 text-slate-600 font-bold transition flex items-center justify-center gap-2 text-xs sm:text-sm" data-value="블로그"><i class="fa-solid fa-blog"></i> 블로그</button>
                                <button type="button" onclick="selectUploadSite('네이버 카페')" class="btn-uploadsite py-3 px-3 rounded-xl border-2 border-slate-200 text-slate-600 font-bold transition flex items-center justify-center gap-2 text-xs sm:text-sm" data-value="네이버 카페"><i class="fa-solid fa-comments"></i> 네이버 카페</button>
                                <button type="button" onclick="selectUploadSite('당근마켓')" class="btn-uploadsite py-3 px-3 rounded-xl border-2 border-slate-200 text-slate-600 font-bold transition flex items-center justify-center gap-2 text-xs sm:text-sm" data-value="당근마켓"><i class="fa-solid fa-carrot"></i> 당근마켓</button>
                                <button type="button" onclick="selectUploadSite('홈페이지')" class="btn-uploadsite py-3 px-3 rounded-xl border-2 border-slate-200 text-slate-600 font-bold transition flex items-center justify-center gap-2 text-xs sm:text-sm" data-value="홈페이지"><i class="fa-solid fa-globe"></i> 홈페이지</button>
                                <button type="button" onclick="selectUploadSite('기타')" class="btn-uploadsite py-3 px-3 rounded-xl border-2 border-slate-200 text-slate-600 font-bold transition flex items-center justify-center gap-2 text-xs sm:text-sm" data-value="기타"><i class="fa-solid fa-ellipsis"></i> 기타</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 공통 하단 항목 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">우선순위 <span class="required-star">*</span></label>
                    <select id="c-priority" required class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none">
                        <option value="보통">보통</option>
                        <option value="긴급">긴급</option>
                        <option value="여유">여유</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">특이사항 및 상세 요청 내용 <span class="required-star">*</span></label>
                    <textarea id="c-details" required rows="4" placeholder="문구, 구성, 참고 디자인 등 요구사항을 상세히 적어주세요." class="w-full px-4 py-3 rounded-lg border border-slate-200 focus:outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">사진/참고파일 첨부</label>
                    <input type="file" id="c-file" class="w-full px-4 py-2 border border-slate-200 rounded-lg text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-rose-50 file:text-brand">
                </div>

                <button type="submit" id="submit-btn" class="w-full py-4 bg-brand hover-bg-brand text-white font-bold rounded-xl shadow-lg transition duration-200">
                    디자인 요청 제출하기
                </button>
            </form>
        </section>

        <!-- Section 2: 조회 폼 -->
        <section id="section-lookup" class="hidden space-y-6">
            <div class="bg-white rounded-2xl shadow-md p-6 sm:p-8">
                <h2 class="text-lg font-bold text-slate-900 mb-4">내 요청 내역 찾기</h2>
                <div class="flex flex-col sm:flex-row gap-4">
                    <select id="l-sv" class="flex-1 px-4 py-3 rounded-lg border border-slate-200 focus:outline-none">
                        <option value="">성함을 선택하세요</option>
                        <option value="김현준">김현준</option>
                        <option value="최장호">최장호</option>
                        <option value="이소영">이소영</option>
                        <option value="양지선">양지선</option>
                        <option value="김의현">김의현</option>
                        <option value="황인찬">황인찬</option>
                        <option value="김혜주">김혜주</option>
                    </select>
                    <button onclick="fetchRequests()" class="px-8 py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-lg transition">조회</button>
                </div>
            </div>
            <div id="results-container" class="space-y-4"></div>
        </section>
    </main>

    <script>
        // ⚠️ 2단계에서 발급받은 새 웹 앱 URL로 꼭 바꿔주세요!
        const API_URL = "https://script.google.com/macros/s/AKfycbzgpcPAPdcrhRgPiL7elC8c_DBZqEQC2JgnqwlfiMk7jHa1EBNXNVVq6JgNXwwP-0DXAQ/exec";

        let currentFormType = "가맹점";
        let selectedWorkType = "";
        let selectedUploadSite = "";

        function selectFormType(type) {
            currentFormType = type;
            const btnStore = document.getElementById('btn-type-store');
            const btnMkt = document.getElementById('btn-type-marketing');
            const storeFields = document.getElementById('form-store-fields');
            const mktFields = document.getElementById('form-marketing-fields');

            if(type === '가맹점') {
                btnStore.className = "py-3 px-4 rounded-xl border-2 border-brand bg-rose-50 text-brand font-bold transition flex justify-center items-center gap-2";
                btnMkt.className = "py-3 px-4 rounded-xl border-2 border-slate-200 text-slate-500 font-bold transition flex justify-center items-center gap-2";
                storeFields.classList.remove('hidden');
                mktFields.classList.add('hidden');
            } else {
                btnMkt.className = "py-3 px-4 rounded-xl border-2 border-brand bg-rose-50 text-brand font-bold transition flex justify-center items-center gap-2";
                btnStore.className = "py-3 px-4 rounded-xl border-2 border-slate-200 text-slate-500 font-bold transition flex justify-center items-center gap-2";
                mktFields.classList.remove('hidden');
                storeFields.classList.add('hidden');
            }
        }

        function selectWorkType(val) {
            selectedWorkType = val;
            document.querySelectorAll('.btn-worktype').forEach(b => {
                b.className = b.dataset.value === val 
                    ? "btn-worktype py-3 px-3 rounded-xl border-2 border-brand bg-rose-50 text-brand font-bold transition flex items-center justify-center gap-2 text-xs sm:text-sm"
                    : "btn-worktype py-3 px-3 rounded-xl border-2 border-slate-200 text-slate-600 font-bold transition flex items-center justify-center gap-2 text-xs sm:text-sm";
            });
        }

        function selectUploadSite(val) {
            selectedUploadSite = val;
            document.querySelectorAll('.btn-uploadsite').forEach(b => {
                b.className = b.dataset.value === val 
                    ? "btn-uploadsite py-3 px-3 rounded-xl border-2 border-brand bg-rose-50 text-brand font-bold transition flex items-center justify-center gap-2 text-xs sm:text-sm"
                    : "btn-uploadsite py-3 px-3 rounded-xl border-2 border-slate-200 text-slate-600 font-bold transition flex items-center justify-center gap-2 text-xs sm:text-sm";
            });
        }

        function switchMainTab(tab) {
            document.getElementById('section-create').classList.toggle('hidden', tab !== 'create');
            document.getElementById('section-lookup').classList.toggle('hidden', tab !== 'lookup');
            document.getElementById('tab-create-btn').className = tab === 'create' ? "flex-1 py-3 font-semibold text-center text-brand border-b-2 border-brand transition" : "flex-1 py-3 font-semibold text-center text-slate-500 transition";
            document.getElementById('tab-lookup-btn').className = tab === 'lookup' ? "flex-1 py-3 font-semibold text-center text-brand border-b-2 border-brand transition" : "flex-1 py-3 font-semibold text-center text-slate-500 transition";
        }

        async function handleCreate(e) {
            e.preventDefault();

            const svName = currentFormType === "가맹점" ? document.getElementById('c-store-sv').value : document.getElementById('c-mkt-sv').value;
            if (!svName) { alert("요청자 성함을 선택해 주세요."); return; }
            if (currentFormType === "가맹점" && !selectedWorkType) { alert("작업 분류를 선택해 주세요."); return; }
            if (currentFormType === "마케팅" && !selectedUploadSite) { alert("업로드 사이트를 선택해 주세요."); return; }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "제출 중...";

            const payload = {
                requestType: currentFormType === "가맹점" ? "가맹점 디자인 요청서" : "마케팅 디자인 요청서",
                projectName: document.getElementById('c-project-name').value,
                brand: document.getElementById('c-brand').value,
                priority: document.getElementById('c-priority').value,
                details: document.getElementById('c-details').value,
                sv_name: svName
            };

            if (currentFormType === "가맹점") {
                payload.store = document.getElementById('c-store-name').value;
                payload.deadline = document.getElementById('c-store-deadline').value;
                payload.category = document.getElementById('c-store-category').value;
                payload.workType = selectedWorkType;
            } else {
                payload.deadline = document.getElementById('c-mkt-deadline').value;
                payload.category = document.getElementById('c-mkt-category').value;
                payload.uploadSite = selectedUploadSite;
            }

            const fileInput = document.getElementById('c-file');
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.readAsDataURL(file);
                await new Promise(resolve => {
                    reader.onload = () => {
                        payload.fileData = reader.result;
                        payload.fileName = file.name;
                        payload.fileType = file.type;
                        resolve();
                    };
                });
            }

            try {
                await fetch(API_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify(payload)
                });

                alert("요청이 성공적으로 저장되었습니다!");
                document.getElementById('create-form').reset();
                selectedWorkType = "";
                selectedUploadSite = "";
                document.querySelectorAll('.btn-worktype, .btn-uploadsite').forEach(b => {
                    b.className = b.className.replace('border-brand bg-rose-50 text-brand', 'border-slate-200 text-slate-600');
                });
            } catch (err) {
                alert("제출 중 오류가 발생했습니다.");
            } finally {
                btn.disabled = false;
                btn.innerText = "디자인 요청 제출하기";
            }
        }

        async function fetchRequests() {
            const sv = document.getElementById('l-sv').value;
            const container = document.getElementById('results-container');
            if (!sv) { alert("성함을 선택해 주세요."); return; }

            container.innerHTML = `<p class="text-center text-slate-500 py-8">요청 내역을 불러오는 중...</p>`;

            try {
                const res = await fetch(`${API_URL}?sv_name=${encodeURIComponent(sv)}`);
                const data = await res.json();

                if (!data || data.length === 0) {
                    container.innerHTML = `<p class="text-center text-slate-500 py-8">일치하는 요청 내역이 없습니다.</p>`;
                    return;
                }

                container.innerHTML = data.map(req => `
                    <div class="bg-white rounded-xl shadow-md p-6 border-l-4 border-brand">
                        <div class="flex justify-between items-start mb-3">
                            <div>
                                <span class="text-xs font-bold text-slate-400">[${req.requestType}] ${req.id}</span>
                                <h3 class="text-lg font-bold text-slate-800">${req.projectName} (${req.brand})</h3>
                            </div>
                            <span class="px-3 py-1 text-xs font-bold rounded-full bg-rose-100 text-brand">${req.status}</span>
                        </div>
                        <div class="text-sm text-slate-600 space-y-1 mb-4">
                            <p><strong>요청자:</strong> ${req.sv_name}</p>
                            ${req.store !== '-' ? `<p><strong>지점명:</strong> ${req.store}</p>` : ''}
                            <p><strong>디자인 유형:</strong> ${req.category}</p>
                            <p><strong>작업분류/사이트:</strong> ${req.workTypeOrSite}</p>
                            <p><strong>우선순위:</strong> ${req.priority}</p>
                            <p><strong>희망 마감일:</strong> ${req.deadline}</p>
                            <p><strong>상세내용:</strong> ${req.details}</p>
                            ${req.fileUrl ? `<p><strong>첨부파일:</strong> <a href="${req.fileUrl}" target="_blank" class="text-blue-600 underline font-bold">파일 열기</a></p>` : ''}
                        </div>
                    </div>
                `).join('');

            } catch (e) {
                container.innerHTML = `<p class="text-center text-red-500 py-8">조회에 실패했습니다. 잠시 후 다시 시도해 주세요.</p>`;
            }
        }
    </script>
</body>
</html>
